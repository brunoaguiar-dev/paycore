name: paycore

services:
  postgres:
    image: postgres:18-alpine
    container_name: paycore-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  card-service:
    build:
      context: .
      dockerfile: services/card-service/Dockerfile
    container_name: paycore-card-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/card_db
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
